<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Auto Expire Check</title>
    <!-- ফায়ারবেস SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body>
    <h2>Background Checking...</h2>
    <script>
        const firebaseConfig = {
            databaseURL: "https://bazra-blood-donate-club-web-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function sendTelegramNotification(title, bloodGroup, location, amount, problem, refPhone, date, time, extraDetails) {
            const botToken = "8975147675:AAGrWXFE4-y_L7Sw55P58PL17ukfUlxHAB0";
            const targets = ["8352480462", "@bazra_blood_club"]; 

            let message = title + "\n\n" +
                          `🩸 *রক্তের গ্রুপ:* ${bloodGroup}\n` +
                          `🏥 *স্থান:* ${location}\n` +
                          `📦 *পরিমাণ:* ${amount}\n` +
                          `📅 *রক্তদানের তারিখ ও সময়:* ${date} (${time})\n` +
                          `📋 *সমস্যা:* ${problem}\n` +
                          `📞 *রক্ত গ্রহীতার মোবাইল:* ${refPhone}\n\n` +
                          `${extraDetails}`;

            targets.forEach(targetId => {
                fetch(`https://api.telegram.org/bot${botToken}/sendMessage`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ chat_id: targetId, text: message, parse_mode: "Markdown" })
                }).catch(err => console.error(err));
            });
        }

        // ব্যাকগ্রাউন্ডে ডেটাবেজ চেক
        db.ref('emergencies').once('value', (snapshot) => {
            const data = snapshot.val();
            const currentTime = Date.now();

            if (data) {
                Object.keys(data).forEach(key => {
                    const emergency = data[key];
                    if (emergency && emergency.status === "Pending" && emergency.date && emergency.time) {
                        const targetDateTime = new Date(`${emergency.date}T${emergency.time}`).getTime();
                        
                        // নির্দিষ্ট সময় পার হয়ে গেলে Expired করে মেসেজ পাঠাবে
                        if (currentTime > targetDateTime) {
                            db.ref('emergencies/' + key).update({ status: "Expired" });
                            
                            if (!emergency.expiredNotified) {
                                db.ref('emergencies/' + key).update({ expiredNotified: true });
                                const expiredInfo = `❌ *দুঃখজনক! রক্তের অনুরোধটি মেয়াদোত্তীর্ণ বা ব্যর্থ হয়েছে!*\n\n⚠️ নির্ধারিত সময়ের মধ্যে রক্তদান সম্পন্ন করা সম্ভব হয়নি।`;
                                sendTelegramNotification(
                                    "⌛ *বজরা ব্লাড ডোনেট ক্লাব - অনুরোধ মেয়াদোত্তীর্ণ*",
                                    emergency.bloodGroup, emergency.location, emergency.amount, 
                                    emergency.problem, emergency.refPhone, emergency.date, emergency.time, expiredInfo
                                );
                            }
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
