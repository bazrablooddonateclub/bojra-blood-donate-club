<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বজরা ব্লাড ডোনেট ক্লাব</title>
    <!-- Firebase SDK Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        header { background: #d9534f; color: white; text-align: center; padding: 30px 15px; }
        header h1 { margin: 0; font-size: 2.2em; }
        header p { margin-top: 8px; font-size: 1.1em; opacity: 0.9; }
        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h2 { border-bottom: 2px solid #d9534f; padding-bottom: 8px; color: #d9534f; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background: #d9534f; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button:hover { background: #c9302c; }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .search-box select, .search-box input { flex: 1; min-width: 150px; }
        .donor-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .donor-card { background: #fafafa; border-left: 5px solid #d9534f; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .blood-badge { background: #d9534f; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9em; position: absolute; top: 15px; right: 15px; }
        .btn-call { display: block; text-align: center; background: #28a745; color: white; text-decoration: none; padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        footer { text-align: center; padding: 20px; background: #333; color: white; margin-top: 40px; }
        .loading { text-align: center; color: #666; font-style: italic; }
    </style>
</head>
<body>

    <header>
        <h1>বজরা ব্লাড ডোনেট ক্লাব</h1>
        <p>জরুরী প্রয়োজনে রক্তদান ও জীবন বাঁচানোই আমাদের লক্ষ্য</p>
    </header>

    <div class="container">
        
        <!-- নতুন ডোনার যুক্ত করার ফর্ম -->
        <div class="card">
            <h2>নতুন রক্তদাতা যুক্ত করুন</h2>
            <form id="donorForm">
                <div class="form-group">
                    <label>রক্তদাতার নাম:</label>
                    <input type="text" id="name" required placeholder="যেমন: মো: রফিকুল ইসলাম">
                </div>
                <div class="form-group">
                    <label>রক্তের গ্রুপ:</label>
                    <select id="bloodGroup" required>
                        <option value="">গ্রুপ নির্বাচন করুন</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ফোন নম্বর:</label>
                    <input type="tel" id="phone" required placeholder="01700000000">
                </div>
                <div class="form-group">
                    <label>ঠিকানা/উপজিলা:</label>
                    <input type="text" id="location" required placeholder="যেমন: বজরা, নোয়াখালী">
                </div>
                <button type="submit" id="submitBtn">ডোনার সেভ করুন</button>
            </form>
        </div>

        <!-- ডোনার খোঁজার অংশ -->
        <div class="card">
            <h2>রক্তদাতার তালিকা</h2>
            <div class="search-box">
                <select id="filterGroup">
                    <option value="">সকল গ্রুপের রক্ত</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <input type="text" id="filterLocation" placeholder="এলাকা দিয়ে খুঁজুন...">
            </div>

            <div class="donor-list" id="donorList">
                <div class="loading">ডেটা লোড হচ্ছে...</div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; বজরা ব্লাড ডোনেট ক্লাব - সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <script>
        // Firebase Config
        const firebaseConfig = {
            databaseURL: "https://bojra-blood-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let allDonors = [];

        // ডেটা ফায়ারবেসে সেভ করা
        document.getElementById('donorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "সেভ হচ্ছে...";

            const newDonor = {
                name: document.getElementById('name').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                timestamp: Date.now()
            };

            database.ref('donors').push(newDonor, function(error) {
                submitBtn.disabled = false;
                submitBtn.innerText = "ডোনার সেভ করুন";
                if (error) {
                    alert("সেভ করতে সমস্যা হয়েছে, আবার চেষ্টা করুন।");
                } else {
                    alert("রক্তদাতার তথ্য সারাজীবনের জন্য সেভ হয়ে গেছে!");
                    document.getElementById('donorForm').reset();
                }
            });
        });

        // ডেটা ফায়ারবেস থেকে লোড করা
        database.ref('donors').on('value', function(snapshot) {
            allDonors = [];
            const data = snapshot.val();
            for (let id in data) {
                allDonors.push({ id: id, ...data[id] });
            }
            displayDonors();
        });

        // ডোনার দেখানোর ফাংশন
        function displayDonors() {
            const groupFilter = document.getElementById('filterGroup').value;
            const locationFilter = document.getElementById('filterLocation').value.toLowerCase();
            const donorList = document.getElementById('donorList');
            
            donorList.innerHTML = '';

            const filtered = allDonors.filter(donor => {
                const matchGroup = groupFilter === '' || donor.bloodGroup === groupFilter;
                const matchLocation = donor.location.toLowerCase().includes(locationFilter);
                return matchGroup && matchLocation;
            });

            if (filtered.length === 0) {
                donorList.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">কোনো তথ্য পাওয়া যায়নি।</p>';
                return;
            }

            filtered.reverse().forEach(donor => {
                const card = document.createElement('div');
                card.className = 'donor-card';
                card.innerHTML = `
                    <span class="blood-badge">${donor.bloodGroup}</span>
                    <h3 style="margin:0 0 10px 0;">${donor.name}</h3>
                    <p style="margin: 5px 0;">📍 <strong>ঠিকানা:</strong> ${donor.location}</p>
                    <a href="tel:${donor.phone}" class="btn-call">📞 কল করুন (${donor.phone})</a>
                `;
                donorList.appendChild(card);
            });
        }

        document.getElementById('filterGroup').addEventListener('change', displayDonors);
        document.getElementById('filterLocation').addEventListener('input', displayDonors);
    </script>
</body>
</html>
