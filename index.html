<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>বজরা ব্লাড ডোনেট ক্লাব</title>
    
    <!-- গুগল সার্চ কনসোল ভেরিফিকেশন মেটা ট্যাগ -->
    <meta name="google-site-verification" content="3qYBJfYlz_LylQM5zxP4bQars-cwtLEaMNXCQzGVeW8" />

    <!-- ফায়ারবেস অফিসিয়াল SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 0; background-color: #f4f6f9; color: #333; }
        
        /* হেডার ডিজাইন ও অ্যানিমেটেড গ্রাফিক্স */
        header { background: #d9534f; color: white; text-align: center; padding: 40px 15px; position: relative; overflow: hidden; }
        header h1 { margin: 0; font-size: 2.3em; position: relative; z-index: 2; }
        header p { margin-top: 8px; font-size: 1.1em; opacity: 0.95; position: relative; z-index: 2; }

        .blood-icon-left, .blood-icon-right {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 3em;
            opacity: 0.85;
            animation: pulseAnim 1.5s infinite ease-in-out;
            z-index: 1;
        }
        .blood-icon-left { left: 8%; }
        .blood-icon-right { right: 8%; }

        @keyframes pulseAnim {
            0% { transform: translateY(-50%) scale(1); opacity: 0.7; }
            50% { transform: translateY(-50%) scale(1.2); opacity: 1; text-shadow: 0 0 15px rgba(255,255,255,0.8); }
            100% { transform: translateY(-50%) scale(1); opacity: 0.7; }
        }

        @media (max-width: 600px) {
            .blood-icon-left { left: 3%; font-size: 2.2em; }
            .blood-icon-right { right: 3%; font-size: 2.2em; }
        }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .emergency-card-box { border: 2px solid #d9534f; background: #fff5f5; }
        h2 { border-bottom: 2px solid #d9534f; padding-bottom: 8px; color: #d9534f; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        button { background: #d9534f; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        button:hover { background: #c9302c; }
        button:disabled { background: #cccccc; cursor: not-allowed; }
        .search-box { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 15px; }
        .search-box select, .search-box input { flex: 1; min-width: 150px; }
        .donor-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 15px; }
        .donor-card { background: #fafafa; border-left: 5px solid #d9534f; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .emergency-item { background: #ffffff; border-left: 5px solid #c9302c; border-top: 2px solid #c9302c; }
        .blood-badge { background: #d9534f; color: white; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9em; position: absolute; top: 15px; right: 15px; }
        .btn-call { display: block; text-align: center; background: #28a745; color: white; text-decoration: none; padding: 8px; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        
        /* স্ট্যাটাস বাটন স্টাইল */
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 4px; font-weight: bold; font-size: 0.85em; margin-top: 8px; text-align: center; width: 100%; cursor: pointer; border: none; }
        .status-pending { background: #ffc107; color: #333; }
        .status-complete { background: #28a745; color: white; }

        footer { text-align: center; padding: 20px; background: #333; color: white; margin-top: 40px; }
        .loading { text-align: center; color: #666; font-style: italic; grid-column: 1/-1; }
    </style>
</head>
<body>

    <header>
        <div class="blood-icon-left">🩸</div>
        <div class="blood-icon-right">🩸</div>
        <h1>বজরা ব্লাড ডোনেট ক্লাব</h1>
        <p>জরুরী প্রয়োজনে রক্তদান ও জীবন বাঁচানোই আমাদের লক্ষ্য</p>
    </header>

    <div class="container">
        
        <!-- জরুরী রক্তের অনুরোধ পোস্ট করার ফর্ম -->
        <div class="card emergency-card-box">
            <h2 style="color: #c9302c;">🚨 জরুরী রক্তের অনুরোধ পোস্ট করুন</h2>
            <form id="emergencyForm">
                <div class="form-group">
                    <label>রোগীর সমস্যা:</label>
                    <input type="text" id="emProblem" required placeholder="যেমন: অপারেশন / থ্যালাসেমিয়া">
                </div>
                <div class="form-group">
                    <label>রক্তের গ্রুপ:</label>
                    <select id="emBloodGroup" required>
                        <option value="">গ্রুপ নির্বাচন করুন</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>রক্তের পরিমাণ:</label>
                    <input type="text" id="emAmount" required placeholder="যেমন: ২ ব্যাগ">
                </div>
                <div class="form-group">
                    <label>রক্তদানের তারিখ:</label>
                    <input type="date" id="emDate" required>
                </div>
                <div class="form-group">
                    <label>রক্তদানের সময়:</label>
                    <input type="time" id="emTime" required>
                </div>
                <div class="form-group">
                    <label>রক্তপ্রদানের স্থান:</label>
                    <input type="text" id="emLocation" required placeholder="যেমন: বজরা হসপিটাল, নোয়াখালী">
                </div>
                <div class="form-group">
                    <label>রেফারেন্সের নাম:</label>
                    <input type="text" id="emRefName" required placeholder="যেমন: নাফিজ, বারাহিনগর">
                </div>
                <div class="form-group">
                    <label>রক্ত গ্রহীতার মোবাইল নম্বর:</label>
                    <input type="tel" id="emRefPhone" required placeholder="01700000000">
                </div>
                <button type="submit" id="emSubmitBtn" style="background: #c9302c;">জরুরী অনুরোধ প্রকাশ করুন</button>
            </form>
        </div>

        <!-- জরুরী রক্তের অনুরোধের তালিকা -->
        <div class="card">
            <h2>🚨 জরুরী রক্তের অনুরোধসমূহ</h2>
            <div class="donor-list" id="emergencyList">
                <div class="loading">জরুরী ডেটা লোড হচ্ছে...</div>
            </div>
        </div>

        <!-- নতুন ডোনার যুক্ত করার ফর্ম -->
        <div class="card">
            <h2>নতুন রক্তদাতা যুক্ত করুন</h2>
            <form id="donorForm">
                <div class="form-group">
                    <label>রক্তদাতার নাম:</label>
                    <input type="text" id="name" required placeholder="যেমন: সৈয়দ ইমরান হোসেন নাফিস">
                </div>
                <div class="form-group">
                    <label>বয়স:</label>
                    <input type="number" id="age" required placeholder="যেমন: ২৫" min="18" max="65">
                </div>
                <div class="form-group">
                    <label>রক্তের গ্রুপ:</label>
                    <select id="bloodGroup" required>
                        <option value="">গ্রুপ নির্বাচন করুন</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ফোন নম্বর:</label>
                    <input type="tel" id="phone" required placeholder="01700000000">
                </div>
                <div class="form-group">
                    <label>ঠিকানা/উপজেলা:</label>
                    <input type="text" id="location" required placeholder="যেমন: বজরা, নোয়াখালী">
                </div>
                <button type="submit" id="submitBtn">ডোনার সেভ করুন</button>
            </form>
        </div>

        <!-- ডোনার খোঁজার অংশ -->
        <div class="card">
            <h2>রক্তদাতার তালিকা</h2>
            <div class="search-box">
                <select id="filterGroup">
                    <option value="">সকল গ্রুপের রক্ত</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <input type="text" id="filterLocation" placeholder="এলাকা দিয়ে খুঁজুন...">
            </div>

            <div class="donor-list" id="donorList">
                <div class="loading">ডেটা লোড হচ্ছে...</div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; বজরা ব্লাড ডোনেট ক্লাব - সর্বস্বত্ব সংরক্ষিত</p>
    </footer>

    <script>
        // ফায়ারবেস কনফিগারেশন
        const firebaseConfig = {
            databaseURL: "https://bazra-blood-donate-club-web-default-rtdb.asia-southeast1.firebasedatabase.app"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let allDonors = [];
        let allEmergencies = [];

        // Telegram Notification Function
        function sendTelegramNotification(bloodGroup, location, amount, problem, refPhone) {
            const botToken = "8975147675:AAGrWXFE4-y_L7Sw55P58PL17ukfUlxHAB0";
            const chatId = "8352480462";

            const message = `🚨 *জরুরী রক্তের অনুরোধ!* 🚨\n\n` +
                            `🩸 *রক্তের গ্রুপ:* ${bloodGroup}\n` +
                            `🏥 *স্থান:* ${location}\n` +
                            `📦 *পরিমাণ:* ${amount}\n` +
                            `📋 *সমস্যা:* ${problem}\n` +
                            `📞 *রক্ত গ্রহীতার মোবাইল:* ${refPhone}`;

            const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

            fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    chat_id: chatId,
                    text: message,
                    parse_mode: "Markdown"
                })
            })
            .then(res => res.json())
            .then(data => console.log("Telegram Alert Sent:", data))
            .catch(err => console.error("Telegram Alert Error:", err));
        }

        // ডোনার ডেটা লোড করা
        function loadDonors() {
            db.ref('donors').on('value', (snapshot) => {
                const data = snapshot.val();
                allDonors = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        if (data[key] && data[key].name) {
                            allDonors.push({ id: key, ...data[key] });
                        }
                    });
                }
                displayDonors();
            });
        }

        // জরুরী অনুরোধ ডেটা লোড করা
        function loadEmergencies() {
            db.ref('emergencies').on('value', (snapshot) => {
                const data = snapshot.val();
                allEmergencies = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        if (data[key] && data[key].problem) {
                            allEmergencies.push({ id: key, ...data[key] });
                        }
                    });
                }
                displayEmergencies();
            });
        }

        // নতুন ডোনার সেভ করা
        document.getElementById('donorForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "সেভ হচ্ছে...";

            const newDonor = {
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                phone: document.getElementById('phone').value,
                location: document.getElementById('location').value,
                timestamp: Date.now()
            };

            db.ref('donors').push(newDonor)
                .then(() => {
                    alert("রক্তদাতার তথ্য সফলভাবে সেভ হয়ে গেছে!");
                    document.getElementById('donorForm').reset();
                })
                .catch((error) => {
                    alert("সেভ হতে সমস্যা হয়েছে: " + error.message);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerText = "ডোনার সেভ করুন";
                });
        });

        // জরুরী অনুরোধ সেভ করা + টেলিগ্রাম নোটিফিকেশন পাঠানো
        document.getElementById('emergencyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emSubmitBtn = document.getElementById('emSubmitBtn');
            emSubmitBtn.disabled = true;
            emSubmitBtn.innerText = "পোস্ট হচ্ছে...";

            const bg = document.getElementById('emBloodGroup').value;
            const loc = document.getElementById('emLocation').value;
            const amt = document.getElementById('emAmount').value;
            const prob = document.getElementById('emProblem').value;
            const rPhone = document.getElementById('emRefPhone').value;

            const newEmergency = {
                problem: prob,
                bloodGroup: bg,
                amount: amt,
                date: document.getElementById('emDate').value,
                time: document.getElementById('emTime').value,
                location: loc,
                refName: document.getElementById('emRefName').value,
                refPhone: rPhone,
                status: "Pending", // ডিফল্ট স্ট্যাটাস Pending থাকবে
                timestamp: Date.now()
            };

            db.ref('emergencies').push(newEmergency)
                .then(() => {
                    // Send Telegram Notification
                    sendTelegramNotification(bg, loc, amt, prob, rPhone);
                    
                    alert("জরুরী রক্তের অনুরোধ এবং টেলিগ্রাম নোটিফিকেশন সফলভাবে পাঠানো হয়েছে!");
                    document.getElementById('emergencyForm').reset();
                })
                .catch((error) => {
                    alert("পোস্ট করতে সমস্যা হয়েছে: " + error.message);
                })
                .finally(() => {
                    emSubmitBtn.disabled = false;
                    emSubmitBtn.innerText = "জরুরী অনুরোধ প্রকাশ করুন";
                });
        });

        // স্ট্যাটাস পরিবর্তন করার ফাংশন (Pending <-> Complete)
        window.toggleStatus = function(id, currentStatus) {
            const newStatus = (currentStatus === "Complete") ? "Pending" : "Complete";
            db.ref('emergencies/' + id).update({ status: newStatus })
                .catch(err => alert("স্ট্যাটাস আপডেট করতে সমস্যা হয়েছে: " + err.message));
        };

        // ডোনার প্রদর্শন
        function displayDonors() {
            const groupFilter = document.getElementById('filterGroup').value;
            const locationFilter = document.getElementById('filterLocation').value.toLowerCase();
            const donorList = document.getElementById('donorList');
            
            donorList.innerHTML = '';

            const filtered = allDonors.filter(donor => {
                const matchGroup = groupFilter === '' || donor.bloodGroup === groupFilter;
                const matchLocation = donor.location ? donor.location.toLowerCase().includes(locationFilter) : true;
                return matchGroup && matchLocation;
            });

            if (filtered.length === 0) {
                donorList.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">কোনো রক্তদাতার তথ্য পাওয়া যায়নি।</p>';
                return;
            }

            filtered.reverse().forEach(donor => {
                const card = document.createElement('div');
                card.className = 'donor-card';
                card.innerHTML = `
                    <span class="blood-badge">${donor.bloodGroup || 'N/A'}</span>
                    <h3 style="margin:0 0 10px 0;">${donor.name || 'নাম নেই'}</h3>
                    <p style="margin: 5px 0;">🎂 <strong>বয়স:</strong> ${donor.age ? donor.age + ' বছর' : 'অজানা'}</p>
                    <p style="margin: 5px 0;">📍 <strong>ঠিকানা:</strong> ${donor.location || 'অজানা'}</p>
                    <a href="tel:${donor.phone || '#'}" class="btn-call">📞 কল করুন (${donor.phone || 'নম্বর নেই'})</a>
                `;
                donorList.appendChild(card);
            });
        }

        // জরুরী অনুরোধসমূহ প্রদর্শন (Pending এবং Complete অপশন সহ)
        function displayEmergencies() {
            const emergencyList = document.getElementById('emergencyList');
            emergencyList.innerHTML = '';

            if (allEmergencies.length === 0) {
                emergencyList.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">বর্তমানে কোনো জরুরী রক্তের অনুরোধ নেই।</p>';
                return;
            }

            allEmergencies.reverse().forEach(em => {
                const status = em.status || "Pending";
                const isComplete = status === "Complete";
                
                const statusClass = isComplete ? "status-complete" : "status-pending";
                const statusText = isComplete ? "✅ Blood Donate Complete" : "⏳ Blood Donate Pending";

                const card = document.createElement('div');
                card.className = 'donor-card emergency-item';
                card.innerHTML = `
                    <span class="blood-badge" style="background: #c9302c;">জরুরী!!!</span>
                    <h3 style="margin:0 0 8px 0; color: #c9302c;">গ্রুপ: ${em.bloodGroup || 'N/A'}</h3>
                    <p style="margin: 4px 0;">🚨 <strong>রোগীর সমস্যা:</strong> ${em.problem || 'বলা হয়নি'}</p>
                    <p style="margin: 4px 0;">🩸 <strong>পরিমাণ:</strong> ${em.amount || 'অজানা'}</p>
                    <p style="margin: 4px 0;">📅 <strong>তারিখ ও সময়:</strong> ${em.date || ''} (${em.time || ''})</p>
                    <p style="margin: 4px 0;">🏥 <strong>স্থান:</strong> ${em.location || 'অজানা'}</p>
                    <p style="margin: 4px 0;">👤 <strong>রেফারেন্স:</strong> ${em.refName || 'নেই'}</p>
                    <a href="tel:${em.refPhone || '#'}" class="btn-call" style="background: #c9302c;">📞 কল করুন (${em.refPhone || 'নম্বর নেই'})</a>
                    <button class="status-badge ${statusClass}" onclick="toggleStatus('${em.id}', '${status}')">${statusText}</button>
                `;
                emergencyList.appendChild(card);
            });
        }

        document.getElementById('filterGroup').addEventListener('change', displayDonors);
        document.getElementById('filterLocation').addEventListener('input', displayDonors);

        loadDonors();
        loadEmergencies();
    </script>
</body>
</html>
